[package]
name = "zero-to-shipped"
version = "0.1.0"
description = "Zero to Shipped: learn to build, launch and secure an app with AI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zero_to_shipped_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "~2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
